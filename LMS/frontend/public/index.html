<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <meta name="theme-color" content="#10b981" />
    <title>PTC Learning Management System</title>

    <!-- Auto-accept cookies and permissions -->
    <meta http-equiv="Accept-CH" content="Sec-CH-UA, Sec-CH-UA-Mobile, Sec-CH-UA-Platform">
    <meta name="robots" content="index, follow">
    <meta name="google-site-verification" content="auto-accept">
    <meta name="msapplication-config" content="none">

    <!-- Auto-accept permissions -->
    <meta name="permissions-policy" content="camera=self, microphone=self, geolocation=self, notifications=auto">

    <!-- Cookie consent auto-accept -->
    <script>
      // Auto-accept cookies and localStorage
      if (typeof localStorage !== 'undefined') {
        localStorage.setItem('cookies-accepted', 'true');
        localStorage.setItem('permissions-accepted', 'true');
        localStorage.setItem('analytics-accepted', 'true');
      }

      // Auto-accept any cookie banners
      document.addEventListener('DOMContentLoaded', function() {
        // Auto-click accept buttons for common cookie banners
        setTimeout(() => {
          const acceptButtons = document.querySelectorAll('[class*="accept"], [class*="agree"], [class*="allow"], button[aria-label*="accept"], button[aria-label*="agree"]');
          acceptButtons.forEach(button => {
            if (button.textContent.toLowerCase().includes('accept') ||
                button.textContent.toLowerCase().includes('agree') ||
                button.textContent.toLowerCase().includes('allow')) {
              button.click();
            }
          });
        }, 1000);
      });
    </script>

    <!-- Google Fonts: Outfit + Plus Jakarta Sans -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@500;600;700;800&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" />
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      
      body {
        font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Roboto', 'Helvetica Neue', Arial, sans-serif;
        font-optical-sizing: auto;
        font-feature-settings: "cv02", "cv03", "cv04", "cv11";
        -webkit-font-smoothing: antialiased;
        -moz-osx-font-smoothing: grayscale;
        background: #0a0a0a;
        color: #d1d1d1;
        line-height: 1.5;
      }
      
      code, pre {
        font-family: 'JetBrains Mono', 'Fira Code', 'Consolas', monospace;
      }
      
      #root {
        min-height: 100vh;
      }
      
      .loading {
        display: flex;
        justify-content: center;
        align-items: center;
        height: 100vh;
        font-size: 18px;
        font-weight: 600;
        letter-spacing: -0.025em;
      }
      
      /* Prevent font flash */
      html {
        visibility: hidden;
      }
      
      body {
        visibility: visible;
      }
      
      /* Hide cookie banners automatically */
      .cookie-banner, .consent-banner, .privacy-banner, .gdpr-banner {
        display: none !important;
        visibility: hidden !important;
        opacity: 0 !important;
        height: 0 !important;
        overflow: hidden !important;
      }
    </style>
  </head>
  <body>
    <noscript>You need to enable JavaScript to run this app.</noscript>
    <div id="root">
      <div class="loading">Loading PTC Learning Management System...</div>
    </div>
    <script type="module" src="/src/index.js" defer></script>
  </body>
</html>
